name: Create prerelease on tag
on:
  push:
    tags:
      - "*.*.*.*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])\.(0|[1-9][0-9]{0,4})$ ]]; then
            echo 'Use an existing YYYY.M.D.N tag without leading zeroes.' >&2
            exit 1
          fi
          counter=${RELEASE_TAG##*.}
          if ((counter > 65535)); then
            echo 'Release counter exceeds the extension manifest limit.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      # intentially do not use cache to keep the build more comprehensible and sandboxed
      - name: Install dependencies
        run: npm ci

      - name: Build Legal
        run: npm run license-report:html

      - name: Build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run-script build -- --all --version "$RELEASE_TAG"
        shell: bash

      - name: Package reviewed source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git archive --format=zip --prefix=sottaku-yomitan/ --output="builds/sottaku-yomitan-source-$RELEASE_TAG.zip" HEAD

      - name: Generate hashes
        id: hash
        run: |
          cd builds
          sha256sum -- *.zip > SHA256SUMS
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Release
        id: release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # pin@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            builds/*.zip
            builds/SHA256SUMS

  provenance:
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
