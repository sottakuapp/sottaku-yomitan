name: publish-chrome
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-on-webstore:
    runs-on: ubuntu-latest
    environment: cd
    outputs:
      result: ${{ steps.webStorePublish.outcome }}
    steps:
      - name: Check release configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOKEN: ${{ secrets.G_REFRESH_TOKEN }}
          G_STABLE_EXTENSION_ID: ${{ secrets.G_STABLE_EXTENSION_ID }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])\.(0|[1-9][0-9]{0,4})$ ]]; then
            echo 'Use an existing YYYY.M.D.N release tag.' >&2
            exit 1
          fi
          counter=${RELEASE_TAG##*.}
          if ((counter > 65535)); then
            echo 'Release counter exceeds the extension manifest limit.' >&2
            exit 1
          fi
          missing=0
          for name in G_CLIENT_ID G_CLIENT_SECRET G_REFRESH_TOKEN G_STABLE_EXTENSION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release secret: $name. Configure it or use the documented manual store upload."
              missing=1
            fi
          done
          exit "$missing"

      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # pin@v1.13
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"

      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT: sottaku-yomitan-chrome.zip
        run: |
          sha256sum --check SHA256SUMS
          python3 - <<'PYTHON'
          import json, os, zipfile
          with zipfile.ZipFile(os.environ["ARTIFACT"]) as archive:
              manifest = json.loads(archive.read("manifest.json"))
          if manifest["version"] != os.environ["RELEASE_TAG"]:
              raise SystemExit("Artifact version does not match the release tag")
          PYTHON

      - name: Fetch Google API access token
        id: fetchAccessToken
        uses: cardinalby/google-api-fetch-token-action@f455422472a558d48d939e77a65cdcec38e707b5 # pin@v1.0.4
        with:
          clientId: ${{ secrets.G_CLIENT_ID }}
          clientSecret: ${{ secrets.G_CLIENT_SECRET }}
          refreshToken: ${{ secrets.G_REFRESH_TOKEN }}

      - name: Upload to Google Web Store
        id: webStoreUpload
        continue-on-error: true
        uses: cardinalby/webext-buildtools-chrome-webstore-upload-action@3d829e042b559c35f7fb71676cbaf6031892a313 # v1.0.11
        with:
          zipFilePath: sottaku-yomitan-chrome.zip
          extensionId: ${{ secrets.G_STABLE_EXTENSION_ID }}
          apiAccessToken: ${{ steps.fetchAccessToken.outputs.accessToken }}
          waitForUploadCheckCount: 10
          waitForUploadCheckIntervalMs: 180000 # 3 minutes

      - name: Abort on unrecoverable upload error
        if: |
          !steps.webStoreUpload.outputs.newVersion &&
          steps.webStoreUpload.outputs.sameVersionAlreadyUploadedError != 'true'
        run: exit 1

      - name: Publish on Google Web Store
        id: webStorePublish
        if: |
          steps.webStoreUpload.outputs.newVersion ||
          steps.webStoreUpload.outputs.sameVersionAlreadyUploadedError == 'true'
        uses: cardinalby/webext-buildtools-chrome-webstore-publish-action@d39ebd4ab4ea4b44498bf5fc34d4b3db7706f1ed # pin@v1.0.7
        with:
          extensionId: ${{ secrets.G_STABLE_EXTENSION_ID }}
          apiAccessToken: ${{ steps.fetchAccessToken.outputs.accessToken }}
